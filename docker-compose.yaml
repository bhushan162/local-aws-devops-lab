version: "3.8"

services:
  local-aws:
    image: localstack/localstack:4.4.0
    container_name: local-aws-server
    ports:
      - "4566:4566"            # LocalStack API Gateway
      - "4510-4559:4510-4559"  # External services port range
    environment:
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "localstack_data:/var/lib/localstack" # Persist your local AWS state
    networks:
      - devops-net
  local-k8s-cluster:
    image: rancher/k3s:v1.28.2-k3s1
    container_name: local-k8s-cluster
    privileged: true
    cgroup: host
    command: server --disable traefik --write-kubeconfig-mode 666 --tls-san local-k8s-cluster
    tmpfs:
      - /run
      - /var/run
    environment:
      - K3S_TOKEN=bhushan_super_secret_devops_token
      - K3S_KUBECONFIG_OUTPUT=/output/kubeconfig.yaml
    volumes:
      # Automatically exports the internal cluster config file to your host client space
      - k3s-server-data:/var/lib/rancher/k3s
      - k3s-shared-config:/output

    ports:
      - "6443:6443" # Kubernetes API Server Endpoint
    networks:
      - devops-net

  ubuntu-client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ubuntu-aws-client
    environment:
      # Dummy credentials required by the AWS CLI to execute commands
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      # For Python / Boto3
      - AWS_ENDPOINT_URL=http://local-aws:4566
      # For the awslocal CLI wrapper
      - LOCALSTACK_HOST=local-aws:4566
      # Tell kubectl where to find the cluster config
      - KUBECONFIG=/output/kubeconfig.yaml
    volumes:
      - k3s-shared-config:/output
    networks:
      - devops-net
    depends_on:
      - local-aws
      - local-k8s-cluster

volumes:
  localstack_data:
  k3s-shared-config:
  k3s-server-data:
networks:
  devops-net:
    driver: bridge